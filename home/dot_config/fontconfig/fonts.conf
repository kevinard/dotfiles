<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>
  <edit name="rgba" mode="assign">
    <const>rgb</const>
  </edit>
  <match target="font">
    <test name="family" qual="any">
      <string>JoyPixels</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" qual="any">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" qual="any">
      <string>Symbols Nerd Font</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Libertinus Serif Display</family>
   <family>Libertinus Serif</family>
   <family>Linux Libertine Display O</family>
   <family>Linux Libertine O</family>
   <family>JoyPixels</family>
   <family>Noto Color Emoji</family>
   <family>Symbols Nerd Font</family>
   <family>DejaVu Serif</family>
  </prefer>
 </alias>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Inter Display</family>
   <family>Inter</family>
   <family>JoyPixels</family>
   <family>Noto Color Emoji</family>
   <family>Symbols Nerd Font</family>
   <family>DejaVu Sans</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <family>Atkinson Hyperlegible Mono</family>
   <family>JetBrainsMono</family>
   <family>JetBrains Mono</family>
   <family>JoyPixels</family>
   <family>Noto Color Emoji</family>
   <family>Symbols Nerd Font Mono</family>
  </prefer>
 </alias>
</fontconfig>
