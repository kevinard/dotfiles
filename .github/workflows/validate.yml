name: Validate dotfiles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh desktop-file-utils
          go install github.com/twpayne/chezmoi/v2@v2.73.0
      - name: Render profiles and test helpers
        run: scripts/check-dotfiles
